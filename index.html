<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Symvolo — math notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="vendor/katex.min.css">
<style>
/* VOICE: a quiet instrument — the notes are loud, the chrome whispers.
   IDEA: a cross-hatched screen you pin formula cards onto, like a lab notebook under glass.
   PICTURE: the full-screen workspace of small crosses; blocks of real LaTeX floating on it.
   COLOUR and TYPE: surface chosen by the user, chrome follows it light/dark; cobalt accent; Geist UI, KaTeX serif for notes.
   LAYOUT: floating pill bars at the four corners, tool rail on the left, inspector sheet on the right. */
:root{
  --G:24px;--accent:#2f55e4;--accent-soft:#e7ecff;--accent-fg:#fff;
  --panel:#fff;--panel-2:#f4f5f7;--panel-3:#eaecf0;--line:#e2e4e9;--line-strong:#cdd1d8;
  --fg:#14161b;--muted:#5b616d;--subtle:#8a909b;--warn:#c27a0e;--warn-soft:#fff4df;--danger:#d93a3f;
  --shadow:0 1px 2px rgba(15,20,35,.06),0 10px 30px rgba(15,20,35,.10);
  --surface:#f6f6f3;--note-ink:#17191e;--card:#ffffff;--mark:rgba(255,214,10,.38);
  --note-font:KaTeX_Main,"STIX Two Text","Times New Roman",serif;
  --ui:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"Geist Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
:root[data-chrome=dark]{
  --accent:#7f97ff;--accent-soft:#222a4a;--accent-fg:#0b0e1c;
  --panel:#17181d;--panel-2:#1e2026;--panel-3:#272a32;--line:#2b2e36;--line-strong:#3b3f4a;
  --fg:#f1f2f5;--muted:#a5a9b4;--subtle:#767b87;--warn:#f0b046;--warn-soft:#3a2d14;--danger:#ff6b6f;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 34px rgba(0,0,0,.45);
  --note-ink:#eef0f4;--card:rgba(255,255,255,.07);--mark:rgba(255,214,10,.22);
  color-scheme:dark;
}
:root[data-font=sans]{--note-font:"Geist",ui-sans-serif,system-ui,sans-serif}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;margin:0;overflow:hidden}
body{font:14px/1.45 var(--ui);color:var(--fg);background:var(--surface);-webkit-font-smoothing:antialiased;touch-action:none}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* stage */
#stage{position:fixed;inset:0;overflow:hidden;background-color:var(--surface);cursor:default}
#stage[data-tool=pan],#stage.panning{cursor:grab}#stage.panning:active{cursor:grabbing}
#stage[data-tool=text],#stage[data-tool=math]{cursor:crosshair}
#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#marquee{position:absolute;border:1px solid var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent);border-radius:4px;pointer-events:none}

/* blocks */
.blk{position:absolute;padding:6px 10px;border-radius:8px;color:var(--note-ink);font-family:var(--note-font);font-size:calc(19px * var(--sc,1));line-height:1.5;user-select:none;-webkit-user-select:none;cursor:grab;outline:1.5px solid transparent;outline-offset:2px;transition:outline-color .12s}
.blk:hover{outline-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.blk.sel{outline-color:var(--accent)}
.blk.locked{cursor:default}
.blk.k-math{white-space:nowrap}
.blk.f-card{background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.06)}
.blk.f-mark{background:var(--mark)}
.blk.unsure{outline:1.5px dashed var(--warn)}
.blk.unsure.sel{outline-style:solid}
.blk .body p{margin:0 0 .35em}.blk .body p:last-child{margin-bottom:0}
.blk .body .h1{font-size:1.7em;font-weight:700;line-height:1.2;margin:0 0 .25em}
.blk .body .h2{font-size:1.32em;font-weight:700;line-height:1.25;margin:0 0 .2em}
.blk .body .h3{font-size:1.12em;font-weight:700;margin:0 0 .15em}
.blk .body ul,.blk .body ol{margin:0 0 .35em;padding-left:1.25em}
.blk .body .gap{height:.5em}
.blk .body code{font-family:var(--mono);font-size:.82em;background:color-mix(in srgb,currentColor 10%,transparent);padding:.05em .3em;border-radius:4px}
.blk .body mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 .1em}
.blk .body .katex-display{margin:.2em 0}
.blk .body .err{color:var(--danger);font-family:var(--mono);font-size:.75em;white-space:pre-wrap}
.blk.k-image{padding:0;line-height:0}
.blk.k-image img{width:100%;height:auto;border-radius:8px;display:block;pointer-events:none}
.blk .rz{position:absolute;right:-7px;bottom:-7px;width:14px;height:14px;border-radius:4px;background:var(--panel);border:2px solid var(--accent);cursor:nwse-resize;display:none}
.blk.sel:not(.locked) .rz{display:block}
.blk .lockdot{position:absolute;top:-9px;right:-9px;width:18px;height:18px;border-radius:50%;background:var(--panel);border:1px solid var(--line-strong);display:none;place-items:center;color:var(--muted)}
.blk.locked.sel .lockdot{display:grid}
.blk .lockdot svg{width:11px;height:11px}

/* floating chrome */
.ui{position:fixed;z-index:20;display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:5px}
.tl{top:14px;left:14px;padding-right:8px}
.tr{top:14px;right:14px}
.rail{left:14px;top:50%;transform:translateY(-50%);flex-direction:column}
.bl{left:14px;bottom:14px}
.br{right:14px;bottom:14px}
.sep{width:1px;align-self:stretch;background:var(--line);margin:4px 2px}
.rail .sep{width:auto;height:1px;margin:2px 4px}
.ibtn{width:38px;height:38px;display:grid;place-items:center;border:0;border-radius:9px;background:transparent;color:var(--muted);cursor:pointer;position:relative}
.ibtn:hover{background:var(--panel-2);color:var(--fg)}
.ibtn[aria-pressed=true]{background:var(--accent-soft);color:var(--accent)}
.ibtn:disabled{opacity:.35;cursor:default;background:transparent}
.btn{height:38px;display:inline-flex;align-items:center;gap:8px;padding:0 13px;border:1px solid transparent;border-radius:9px;background:transparent;color:var(--fg);font-weight:500;font-size:13.5px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--panel-2)}
.btn.primary{background:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{background:color-mix(in srgb,var(--accent) 88%,#000)}
.btn.outline{border-color:var(--line-strong)}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.45;cursor:default}
.btn.sm{height:32px;padding:0 10px;font-size:13px}
.logo{display:flex;align-items:center;gap:9px;padding:0 6px 0 2px}
.logo-mark{width:30px;height:30px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.logo-mark svg{width:16px;height:16px;stroke-width:2.4}
.logo-word{font-weight:650;font-size:16px;letter-spacing:-.02em}
#wsName{width:clamp(110px,18vw,240px);height:34px;border:1px solid transparent;border-radius:8px;background:transparent;padding:0 9px;font-weight:500;font-size:14px;text-overflow:ellipsis}
#wsName:hover{border-color:var(--line)}#wsName:focus{border-color:var(--accent);outline:none;background:var(--panel-2)}
.zoomv{font:500 12.5px var(--mono);color:var(--muted);min-width:52px;text-align:center;border:0;background:none;height:38px;border-radius:8px;cursor:pointer}
.zoomv:hover{background:var(--panel-2);color:var(--fg)}
.swatch-btn{width:26px;height:26px;border-radius:7px;border:1px solid var(--line-strong);background:var(--surface)}
.tip{position:absolute;left:calc(100% + 10px);top:50%;transform:translateY(-50%);background:var(--fg);color:var(--panel);font-size:12px;padding:4px 8px;border-radius:6px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .12s}
.rail .ibtn:hover .tip{opacity:1}
.tip kbd{font-family:var(--mono);opacity:.65;margin-left:6px}

/* popovers */
.pop{position:fixed;z-index:40;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;min-width:240px;max-width:min(340px,calc(100vw - 24px))}
.pop .mi{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:0;border-radius:8px;background:none;text-align:left;cursor:pointer;color:var(--fg)}
.pop .mi:hover{background:var(--panel-2)}
.pop .mi small{display:block;color:var(--subtle);font-size:12px;margin-top:1px}
.pop .mi .meta{margin-left:auto;font:12px var(--mono);color:var(--subtle)}
.pop .mi[aria-current=true]{background:var(--accent-soft)}
.pop hr{border:0;border-top:1px solid var(--line);margin:5px 4px}
.pop .lbl{font-size:12px;color:var(--subtle);padding:6px 10px 4px}
.swatches{display:flex;flex-wrap:wrap;gap:8px;padding:4px 10px 10px}
.sw{width:34px;height:34px;border-radius:9px;border:1px solid var(--line-strong);cursor:pointer;position:relative;padding:0}
.sw[aria-pressed=true]{outline:2px solid var(--accent);outline-offset:2px}
.sw input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.sw.custom{background:conic-gradient(#e5484d,#f08c2e,#f5d90a,#12a594,#4a6cf7,#8e6bf0,#e5484d)}

/* inspector */
#insp{position:fixed;z-index:30;right:14px;top:68px;bottom:68px;width:344px;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
#insp .ih{display:flex;align-items:center;gap:8px;padding:10px 10px 10px 14px;border-bottom:1px solid var(--line)}
#insp .ib{overflow:auto;padding:14px;display:flex;flex-direction:column;gap:14px;overscroll-behavior:contain}
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:999px;background:var(--panel-3);font-size:12px;font-weight:600;color:var(--muted)}
.chip.k-math{background:var(--accent-soft);color:var(--accent)}
.grow{flex:1}
.sec{display:flex;flex-direction:column;gap:8px}
.sec h4{margin:0;font-size:12.5px;font-weight:600;color:var(--muted)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row>label{width:84px;font-size:13px;color:var(--muted)}
.row>label.check{width:auto;font-size:14px;color:var(--fg)}
.seg{display:inline-flex;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:2px;gap:2px}
.seg button{height:30px;min-width:34px;padding:0 10px;border:0;border-radius:7px;background:none;color:var(--muted);font-size:13px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.seg button[aria-pressed=true]{background:var(--panel);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg.wide{display:flex}.seg.wide button{flex:1;justify-content:center}
.ink{width:26px;height:26px;border-radius:50%;border:1px solid var(--line-strong);cursor:pointer;padding:0;display:grid;place-items:center;font-size:10px;color:var(--muted)}
.ink[aria-pressed=true]{outline:2px solid var(--accent);outline-offset:2px}
.code{width:100%;min-height:150px;resize:vertical;border:1px solid var(--line);border-radius:10px;background:var(--panel-2);padding:10px 12px;font:13px/1.55 var(--mono);color:var(--fg);tab-size:2}
.code:focus,.rich:focus-within{outline:none;border-color:var(--accent)}
.rich{min-height:150px;max-height:46vh;overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel-2);padding:10px 12px;font:17px/1.6 var(--note-font);white-space:pre-wrap;word-break:break-word;outline:none;cursor:text}
.rich .mfw{display:inline-block;vertical-align:middle;margin:0 2px}
.rich .mfw.disp{display:block;margin:4px 0}
.rich math-field,.mfmain{font-size:20px;background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:2px 6px;color:var(--fg);--caret-color:var(--accent);--selection-background-color:var(--accent-soft);--primary:var(--accent)}
.rich math-field{display:inline-block;min-width:40px}
.rich math-field::part(virtual-keyboard-toggle),.rich math-field::part(menu-toggle){display:none}
.mfmain{display:block;width:100%;font-size:26px;padding:14px 12px;border-radius:10px;background:var(--panel-2);min-height:80px}
.mfmain:focus-within{border-color:var(--accent)}
.hint{font-size:12.5px;color:var(--subtle);line-height:1.5}
.hint kbd,.keys kbd{font:500 11.5px var(--mono);background:var(--panel-3);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;color:var(--muted)}
.banner{display:flex;gap:10px;padding:10px 12px;border-radius:10px;background:var(--warn-soft);color:var(--fg);font-size:13px;align-items:flex-start}
.banner svg{color:var(--warn);margin-top:1px}
.tb{display:flex;gap:6px;flex-wrap:wrap}
input[type=range]{accent-color:var(--accent);flex:1}
.loading{font-size:13px;color:var(--subtle);padding:8px 0}

/* modal */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(10,12,18,.42);display:grid;place-items:center;padding:16px}
.modal{width:min(620px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:20px;display:flex;flex-direction:column;gap:16px}
.modal h2{margin:0;font-size:20px;font-weight:650;letter-spacing:-.01em}
.modal p{margin:0;color:var(--muted)}
.mh{display:flex;align-items:flex-start;gap:12px}
.drop{border:1.5px dashed var(--line-strong);border-radius:12px;padding:26px 16px;display:grid;place-items:center;text-align:center;gap:8px;color:var(--muted);cursor:pointer;background:var(--panel-2)}
.drop.over{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.drop strong{color:var(--fg);font-weight:600}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.thumb{position:relative;aspect-ratio:4/3;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--panel-2)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb button{position:absolute;top:5px;right:5px;width:26px;height:26px;border-radius:7px;border:0;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center;cursor:pointer}
.thumb button svg{width:14px;height:14px}
.opts{display:grid;gap:10px}
.check{display:flex;align-items:center;gap:10px;font-size:14px;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.field{width:100%;height:40px;border:1px solid var(--line);border-radius:9px;background:var(--panel-2);padding:0 12px;font-size:15px}
.field:focus{outline:none;border-color:var(--accent)}
.mf{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.progress{display:flex;gap:14px;align-items:center;padding:14px;border-radius:12px;background:var(--panel-2)}
.spin{width:22px;height:22px;border-radius:50%;border:2.5px solid var(--line-strong);border-top-color:var(--accent);animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.progress b{display:block;font-weight:600}
.progress span{color:var(--muted);font-size:13px}
.note{font-size:13px;color:var(--muted);padding:10px 12px;border-radius:10px;background:var(--panel-2)}

/* empty state & toast */
#empty{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:5}
#empty .card{pointer-events:auto;text-align:center;display:grid;gap:12px;justify-items:center;padding:28px 30px;max-width:420px;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
#empty h3{margin:0;font-size:19px;font-weight:650}
#empty p{margin:0;color:var(--muted)}
#empty .big{width:52px;height:52px;border-radius:14px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
#empty .big svg{width:24px;height:24px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);z-index:80;background:var(--fg);color:var(--panel);padding:10px 16px;border-radius:10px;font-size:13.5px;font-weight:500;opacity:0;pointer-events:none;transition:.2s;max-width:calc(100vw - 32px)}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;padding:8px 10px;font-size:13px;color:var(--muted)}
.keys span:nth-child(odd){text-align:right;white-space:nowrap}


/* handwriting pad */
.modal.wide{width:min(780px,100%)}
.padbar{display:flex;align-items:center;gap:6px}
.padwrap{position:relative;height:clamp(220px,38vh,340px);border:1px solid var(--line);border-radius:12px;background-color:var(--panel-2);background-image:var(--pad-cross);background-size:24px 24px;overflow:hidden}
.padwrap canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.padph{position:absolute;inset:0;display:grid;place-items:center;color:var(--subtle);pointer-events:none;font-size:15px}
.padres{display:grid;gap:10px}
.padprev{min-height:64px;display:grid;place-items:center;padding:10px;border-radius:12px;background:var(--panel-2);font-size:22px;overflow-x:auto;color:var(--fg)}
.padprev .katex-display{margin:0}
.code-in{font-family:var(--mono);font-size:14px}
.altb{font-size:15px}
/* export dialog */
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.modecard{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:14px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel);cursor:pointer;color:var(--fg)}
.modecard svg{width:22px;height:22px;color:var(--muted);margin-top:1px}
.modecard b{display:block;font-weight:600;margin-bottom:3px}
.modecard small{display:block;color:var(--muted);font-size:13px;line-height:1.45}
.modecard[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft)}
.modecard[aria-pressed=true] svg{color:var(--accent)}
.two{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:10px}
@media(max-width:600px){.two{grid-template-columns:minmax(0,1fr)}}
.lprev{display:flex;gap:12px;overflow-x:auto;padding:6px 2px 10px;min-height:120px;align-items:flex-start}
.pv{flex:none;width:222px;height:314px;overflow:hidden;border-radius:4px;border:1px solid var(--line);box-shadow:0 2px 10px rgba(0,0,0,.12);background:#fff}
.pv .lpage{transform:scale(.2796);transform-origin:0 0}
.pvn{align-self:center;color:var(--subtle);font-size:13px;white-space:nowrap;padding:0 6px}
/* typeset LaTeX pages (always white paper) */
.lhost{position:absolute;left:0;top:0;z-index:-6;pointer-events:none}
.lpage{width:794px;height:1123px;background:#fff;color:#111;position:relative;padding:100px 104px 0;font:15.5px/1.45 KaTeX_Main,"Latin Modern Roman","Times New Roman",serif;overflow:hidden;color-scheme:light}
.lbody{height:913px;overflow:hidden}
.lfoot{position:absolute;bottom:58px;left:0;right:0;text-align:center;font-size:15px}
.lit{padding-bottom:9px}
.ltitle{text-align:center;padding:18px 0 30px}
.ltitle h1{font-weight:400;font-size:26px;line-height:1.25;margin:0 0 14px}
.lauthor,.ldate{font-size:16.5px;margin-top:6px}
.lsec{font-weight:700}
.lsec1{font-size:19.5px;padding:14px 0 8px}
.lsec2{font-size:16.5px;padding:10px 0 6px}
.lsec3{font-size:15.5px;padding:8px 0 4px}
.lnum{display:inline-block;margin-right:1em}
.lp{text-align:justify}
.leq{padding:4px 0 14px}.leq .katex-display{margin:0}
.llist ul,.llist ol{margin:0;padding-left:28px}.llist li{margin:0 0 3px}
.lfig img{display:block;max-width:72%;max-height:440px;margin:4px auto 6px;border:1px solid #ddd}
.lpage code{font-family:"Courier New",monospace;font-size:.92em}
.lpage mark{background:none;font-style:italic}
/* export sheet (offscreen) */
.sheet{position:absolute;left:0;top:0;z-index:-5;overflow:hidden}
.sheet .blk{outline:none!important}.sheet .rz,.sheet .lockdot{display:none!important}

@media (pointer:coarse){.ibtn{width:44px;height:44px}.btn{height:44px}}
@media (max-width:760px){
  .lbl-wide{display:none}
  .tr .btn{padding:0 10px}
  .tr{top:68px}
  #wsName{width:min(46vw,220px)}
  .rail{top:auto;bottom:14px;left:50%;transform:translateX(-50%);flex-direction:row}
  .rail .sep{width:1px;height:auto;margin:4px 2px}
  .tip{display:none}
  .bl{bottom:76px}.br{bottom:76px}

<script>
{
const G = 24;
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 10);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const icon = (n, st='') => `<svg class="i" ${st}><use href="#i-${n}"/></svg>`;
const stage = $('#stage'), world = $('#world'), root = document.documentElement;

const SURFACES = [['Paper','#f6f6f3'],['Mist','#e7ebf0'],['Sand','#ece6da'],['Blueprint','#163a6b'],['Chalkboard','#22372f'],['Graphite','#1e1f23'],['Midnight','#0c0e13']];
const INKS = [null,'#4a6cf7','#e5484d','#f08c2e','#12a594','#8e6bf0','#8b8f98'];
const SIZES = [[.8,'S'],[1,'M'],[1.3,'L'],[1.7,'XL']];

/* ---------- storage ---------- */
const KEY = 'symvolo.v1', OLD_KEY = 'crux.v1';
const store = {
  get(){ try { return JSON.parse(localStorage.getItem(KEY) || localStorage.getItem(OLD_KEY)); } catch { return null; } },
  set(v){ try { localStorage.setItem(KEY, JSON.stringify(v)); return true; } catch { return false; } }
};
const prefersDark = (() => { const t = root.getAttribute('data-theme'); if (t) return t === 'dark'; try { return matchMedia('(prefers-color-scheme: dark)').matches; } catch { return false; } })();

function sampleWorkspace(){
  const B = (kind, x, y, content, o={}) => ({ id: uid(), kind, x, y, content, w: o.w || 360, size: o.size || 1, ink: o.ink || null, fill: o.fill || 'none', align: 'left', z: 1, locked: false, ...o });
  return { id: uid(), name: 'Example: Fourier series', bg: prefersDark ? '#1e1f23' : '#f6f6f3', font: 'serif', view: { x: 0, y: 0, z: 1 }, updated: Date.now(), blocks: [
    B('text', 156, 108, '# Fourier series', { w: 456 }),
    B('text', 156, 180, 'A $2\\pi$-periodic function $f$ that is piecewise smooth can be written as a sum of sines and cosines:', { w: 480 }),
    B('math', 180, 276, 'f(x) = \\frac{a_0}{2} + \\sum_{n=1}^{\\infty}\\left(a_n\\cos nx + b_n \\sin nx\\right)', { size: 1.15 }),
    B('text', 156, 396, '## Coefficients', { w: 300 }),
    B('math', 180, 444, '\\begin{aligned} a_n &= \\frac{1}{\\pi}\\int_{-\\pi}^{\\pi} f(x)\\cos nx\\,dx \\\\ b_n &= \\frac{1}{\\pi}\\int_{-\\pi}^{\\pi} f(x)\\sin nx\\,dx \\end{aligned}'),
    B('text', 156, 636, '**Parseval.** The energy is the same in both pictures:', { w: 456 }),
    B('math', 180, 684, '\\frac{1}{\\pi}\\int_{-\\pi}^{\\pi}|f(x)|^2\\,dx = \\frac{a_0^2}{2}+\\sum_{n\\ge1}\\left(a_n^2+b_n^2\\right)', { ink: '#4a6cf7' }),
    B('text', 756, 300, '**Square wave**\n- only odd $n$ survive\n- $b_n = \\dfrac{4}{n\\pi}$, all $a_n = 0$\n- overshoot near jumps ≈ 9 % (Gibbs)', { w: 312, fill: 'card' }),
    B('text', 756, 492, 'Check: at $x=\\pi/2$ this gives $1-\\tfrac13+\\tfrac15-\\dots=\\tfrac{\\pi}{4}$', { w: 312, fill: 'mark', ink: '#e5484d' }),
  ]};
}
function newWorkspace(name){ const cur = S && W(); return { id: uid(), name: name || 'Untitled workspace', bg: cur ? cur.bg : (prefersDark ? '#1e1f23' : '#f6f6f3'), font: cur ? cur.font : 'serif', view: { x: 0, y: 0, z: 1 }, updated: Date.now(), blocks: [] }; }

let S = store.get();
if (!S || !Array.isArray(S.workspaces) || !S.workspaces.length) { const w = sampleWorkspace(); S = { workspaces: [w], activeId: w.id, snap: true }; }
const W = () => S.workspaces.find(w => w.id === S.activeId) || S.workspaces[0];

let saveT = 0, warnedQuota = false;
function persist(){ clearTimeout(saveT); saveT = setTimeout(() => { if (!store.set(S) && !warnedQuota) { warnedQuota = true; toast('Browser storage is full — use Save → Save workspace to keep your work'); } }, 400); }

/* ---------- history ---------- */
let hist = [], fut = [], lastSnap = '';
const snapStr = () => JSON.stringify(W().blocks);
function resetHistory(){ hist = []; fut = []; lastSnap = snapStr(); updUndo(); }
function commit(){ clearTimeout(commitT); const s = snapStr(); if (s === lastSnap) return; hist.push(lastSnap); if (hist.length > 120) hist.shift(); fut = []; lastSnap = s; W().updated = Date.now(); persist(); updUndo(); updEmpty(); }
let commitT = 0; const commitSoon = () => { clearTimeout(commitT); commitT = setTimeout(commit, 600); };
function undo(){ commit(); if (!hist.length) return; fut.push(lastSnap); lastSnap = hist.pop(); W().blocks = JSON.parse(lastSnap); afterRestore(); }
function redo(){ if (!fut.length) return; hist.push(lastSnap); lastSnap = fut.pop(); W().blocks = JSON.parse(lastSnap); afterRestore(); }
function afterRestore(){ for (const id of [...sel]) if (!blk(id)) sel.delete(id); renderAll(); renderInspector(); persist(); updUndo(); }
function updUndo(){ $('#undoBtn').disabled = !hist.length; $('#redoBtn').disabled = !fut.length; }

/* ---------- rendering ---------- */
function tex(src, display){
  if (!window.katex) return `<code>${esc(src)}</code>`;
  try { return katex.renderToString(src, { displayMode: display, throwOnError: false, strict: 'ignore', output: 'html' }); }
  catch (e) { return `<span class="err">${esc(src)}</span>`; }
}
const MATH_RE = /\$\$([\s\S]+?)\$\$|\\\[([\s\S]+?)\\\]|\$([^$\n]+?)\$|\\\(([\s\S]+?)\\\)/g;
function inl(s){
  return s.replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/(^|[^*])\*([^*\s][^*]*?)\*/g, '$1<i>$2</i>').replace(/==(.+?)==/g, '<mark>$1</mark>');
}
function renderRich(src){
  const math = [];
  let s = String(src || '').replace(MATH_RE, (m, a, b, c, d) => { math.push(tex(a ?? b ?? c ?? d, a != null || b != null)); return `\u0000${math.length - 1}\u0000`; });
  s = esc(s);
  let html = '', list = null;
  const close = () => { if (list) { html += `</${list}>`; list = null; } };
  for (const raw of s.split('\n')) {
    const l = raw.trimEnd(); let m;
    if ((m = l.match(/^(#{1,3})\s+(.*)/))) { close(); html += `<div class="h${m[1].length}">${inl(m[2])}</div>`; }
    else if ((m = l.match(/^\s*[-*•]\s+(.*)/))) { if (list !== 'ul') { close(); html += '<ul>'; list = 'ul'; } html += `<li>${inl(m[1])}</li>`; }
    else if ((m = l.match(/^\s*\d+[.)]\s+(.*)/))) { if (list !== 'ol') { close(); html += '<ol>'; list = 'ol'; } html += `<li>${inl(m[1])}</li>`; }
    else if (!l.trim()) { close(); html += '<div class="gap"></div>'; }
    else { close(); html += `<p>${inl(l)}</p>`; }
  }
  close();
  return html.replace(/\u0000(\d+)\u0000/g, (_, i) => math[i]);
}

const els = new Map();
const sel = new Set();
const blk = id => W().blocks.find(b => b.id === id);

function drawBlock(b){
  let el = els.get(b.id);
  if (!el) {
    el = document.createElement('div'); el.dataset.id = b.id;
    el.innerHTML = `<div class="body"></div><div class="rz" data-rz></div><div class="lockdot">${icon('lock')}</div>`;
    world.append(el); els.set(b.id, el);
  }
  el.className = `blk k-${b.kind} f-${b.fill || 'none'}${sel.has(b.id) ? ' sel' : ''}${b.unsure ? ' unsure' : ''}${b.locked ? ' locked' : ''}`;
  el.style.left = b.x + 'px'; el.style.top = b.y + 'px'; el.style.zIndex = b.z || 1;
  el.style.width = b.kind === 'math' ? '' : (b.w || 360) + 'px';
  el.style.setProperty('--sc', b.size || 1);
  el.style.color = b.ink || '';
  el.style.textAlign = b.kind === 'text' ? (b.align || 'left') : '';
  const key = b.kind + '|' + (b.kind === 'image' ? b.src.length + ':' + b.src.slice(-40) : b.content);
  if (el._key !== key) {
    el.firstChild.innerHTML = b.kind === 'math' ? tex(b.content || '\\square', true) : b.kind === 'image' ? `<img src="${b.src}" alt="Photo of notes" draggable="false">` : (b.content.trim() ? renderRich(b.content) : '<p style="opacity:.45">Empty text</p>');
    el._key = key;
  }
  if (b.kind === 'image') el.firstChild.firstChild.style.opacity = b.op ?? 1;
  return el;
}
function renderAll(){
  const ids = new Set(W().blocks.map(b => b.id));
  for (const [id, el] of els) if (!ids.has(id)) { el.remove(); els.delete(id); }
  W().blocks.forEach(drawBlock);
  applyView(); updEmpty();
}
function updEmpty(){ $('#empty').hidden = W().blocks.length > 0; }

/* ---------- surface / view ---------- */
function lum(hex){ const n = parseInt(hex.slice(1), 16); const f = c => { c /= 255; return c <= .03928 ? c / 12.92 : ((c + .055) / 1.055) ** 2.4; }; return .2126 * f(n >> 16 & 255) + .7152 * f(n >> 8 & 255) + .0722 * f(n & 255); }
let crossURL = '';
function applySurface(){
  const w = W(), dark = lum(w.bg) < .22;
  root.dataset.chrome = dark ? 'dark' : 'light';
  root.dataset.font = w.font === 'sans' ? 'sans' : 'serif';
  root.style.setProperty('--surface', w.bg);
  const c = dark ? 'rgba(235,240,250,.30)' : 'rgba(20,24,34,.30)';
  const h = G / 2;
  crossURL = `url("data:image/svg+xml,${encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' width='${G}' height='${G}'><path d='M${h} ${h - 3}v6M${h - 3} ${h}h6' stroke='${c}' stroke-width='1.1' stroke-linecap='round'/></svg>`)}")`;
  stage.style.backgroundImage = crossURL;
  root.style.setProperty('--pad-cross', crossURL);
  $('#surfSw').style.background = w.bg;
  applyView();
}
function applyView(){
  const v = W().view;
  world.style.transform = `translate(${v.x}px,${v.y}px) scale(${v.z})`;
  let g = G * v.z; while (g < 11) g *= 2;
  stage.style.backgroundSize = `${g}px ${g}px`;
  stage.style.backgroundPosition = `${v.x}px ${v.y}px`;
  $('#zoomVal').textContent = Math.round(v.z * 100) + '%';
}

    if (it.t === 'p') return inlTex(it.text);
    if (it.t === 'list') { const e = it.ordered ? 'enumerate' : 'itemize'; return `\\begin{${e}}\n${it.items.map(x => '  \\item ' + inlTex(x)).join('\n')}\n\\end{${e}}`; }
    if (it.t === 'eq') { if (ENV_RE.test(it.tex)) return it.tex; const e = num ? 'equation' : 'equation*'; return `\\begin{${e}}\n  ${it.tex.replace(/\n/g, '\n  ')}\n\\end{${e}}`; }
    return '% [photo of the original notes — add \\includegraphics{...} here]';
  }).join('\n\n');
  return `% Created with Symvolo on ${date}
\\documentclass[11pt,a4paper]{article}
\\usepackage[T1]{fontenc}
\\usepackage[utf8]{inputenc}
\\usepackage{lmodern}
\\usepackage[margin=2.5cm]{geometry}
\\usepackage{amsmath,amssymb,mathtools}
\\usepackage{parskip}
\\usepackage{enumitem}
\\usepackage{hyperref}

\\title{${inlTex(docTitle(d))}}
\\author{${inlTex(pdfOpt.author || '')}}
\\date{${date}}

\\begin{document}
\\maketitle

${body}

\\end{document}
`;
}
function exportTex(){ commit(); if (!W().blocks.length) return toast('Nothing to export yet'); saveFile(slug(W().name) + '.tex', toTex(), 'application/x-tex', true); }
function inlineHtml(s){
  const math = [];
  const t = s.replace(/\$([^$\n]+?)\$|\\\((.+?)\\\)/g, (m, a, b) => { math.push(tex(a ?? b, false)); return `\u0000${math.length - 1}\u0000`; });
  return inl(esc(t)).replace(/\u0000(\d+)\u0000/g, (_, i) => math[i]);
}
let lhost = null;
const mkPage = () => { const p = document.createElement('div'); p.className = 'lpage'; p.innerHTML = '<div class="lbody"></div><div class="lfoot"></div>'; return p; };
async function buildLatexPages(){
  const d = buildDoc(); const date = new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
  lhost?.remove(); lhost = document.createElement('div'); lhost.className = 'lhost'; document.body.append(lhost);
  const nodes = []; const mk = (cls, html) => { const n = document.createElement('div'); n.className = 'lit ' + cls; n.innerHTML = html; nodes.push(n); return n; };
  mk('ltitle', `<h1>${inlineHtml(docTitle(d))}</h1>${pdfOpt.author ? `<div class="lauthor">${esc(pdfOpt.author)}</div>` : ''}<div class="ldate">${date}</div>`);
  const sc = [0, 0, 0]; let eqn = 0;
  for (const it of d.items) {
    if (it.t === 'sec') { sc[it.level - 1]++; for (let i = it.level; i < 3; i++) sc[i] = 0; const n = sc.slice(0, it.level).join('.'); mk(`lsec lsec${it.level}`, `${pdfOpt.numSec ? `<span class="lnum">${n}</span>` : ''}${inlineHtml(it.text)}`); }
    else if (it.t === 'p') mk('lp', inlineHtml(it.text));
    else if (it.t === 'list') mk('llist', `<${it.ordered ? 'ol' : 'ul'}>${it.items.map(x => `<li>${inlineHtml(x)}</li>`).join('')}</${it.ordered ? 'ol' : 'ul'}>`);
    else if (it.t === 'eq') { const tagged = pdfOpt.numEq && !ENV_RE.test(it.tex) && !/\\tag\b|\\notag|\\nonumber/.test(it.tex); mk('leq', tex(tagged ? `${it.tex}\\tag{${++eqn}}` : it.tex, true)); }
    else mk('lfig', `<img src="${it.src}" alt="">`);
  }
  const meas = mkPage(); lhost.append(meas); const mb = meas.firstChild; mb.style.height = 'auto';
  nodes.forEach(n => mb.append(n));
  await document.fonts.ready; await Promise.all([...mb.querySelectorAll('img')].map(i => i.decode().catch(() => {})));
  const hs = nodes.map(n => n.offsetHeight); meas.remove();
  const CAP = 913, pages = []; let cur = null, used = 0;
  const next = () => { cur = mkPage(); lhost.append(cur); pages.push(cur); used = 0; };
  next();
  nodes.forEach((n, i) => {
    const keep = n.classList.contains('lsec') && i + 1 < nodes.length ? Math.min(hs[i + 1], 200) : 0;
    if (used > 0 && used + hs[i] + keep > CAP) next();
    cur.firstChild.append(n); used += hs[i];
  });
  pages.forEach((p, i) => p.lastChild.textContent = i + 1);
  return pages;
}

/* ---------- PDF export dialog ---------- */
let pdfOpt = { mode: 'latex', numEq: true, numSec: true, photos: false, author: '' };
try { Object.assign(pdfOpt, JSON.parse(localStorage.getItem('symvolo.pdf') || '{}')); } catch {}
const savePdfOpt = () => { try { localStorage.setItem('symvolo.pdf', JSON.stringify(pdfOpt)); } catch {} };
let prevT = 0;
function openPdfDialog(){
  commit(); closePop();
  if (!W().blocks.length) return toast('Nothing to export yet');
  const d = buildDoc(), L = pdfOpt.mode === 'latex';
  openModal(`<div class="mh"><h2 class="grow">Export PDF</h2><button class="ibtn" data-x aria-label="Close">${icon('x')}</button></div>
    <div class="modes">
      <button class="modecard" data-mode="screen" aria-pressed="${!L}">${icon('screen')}<span><b>As on screen</b><small>Your workspace with its colours and layout, cut into A4 pages.</small></span></button>
      <button class="modecard" data-mode="latex" aria-pressed="${L}">${icon('tex')}<span><b>LaTeX document</b><small>Typeset as an article: title, numbered sections and equations, Computer Modern type, in reading order.</small></span></button>
    </div>
    <div id="lxOpts" class="opts" ${L ? '' : 'hidden'}>
      <div class="two"><input class="field" id="lxTitle" placeholder="Title" value="${esc(docTitle(d))}" aria-label="Title"><input class="field" id="lxAuthor" placeholder="Author (optional)" value="${esc(pdfOpt.author)}" aria-label="Author"></div>
      <div class="row" style="gap:18px">
        <label class="check"><input type="checkbox" data-o="numSec" ${pdfOpt.numSec ? 'checked' : ''}>Number sections</label>
        <label class="check"><input type="checkbox" data-o="numEq" ${pdfOpt.numEq ? 'checked' : ''}>Number equations</label>
        <label class="check"><input type="checkbox" data-o="photos" ${pdfOpt.photos ? 'checked' : ''}>Include photos</label></div>
      <div class="lprev" id="lxPrev"><div class="loading">Typesetting the preview…</div></div>
      <div class="hint">Blocks are read top to bottom, left to right. Headings become sections, formula blocks become equations. Need it compiled by real LaTeX? Use <b>Download .tex</b> and open it in Overleaf.</div>
    </div>
    <div class="mf"><button class="btn outline" data-x>Cancel</button>${L ? `<button class="btn outline" data-tex>${icon('tex')}Download .tex</button>` : ''}<button class="btn primary" data-go>${icon('pdf')}Export PDF</button></div>`, 'pdf', true);
  const m = $('#modal');
  m.onclick = e => {
    const t = e.target.closest('button'); if (!t) return;
    if (t.dataset.mode) { pdfOpt.mode = t.dataset.mode; savePdfOpt(); openPdfDialog(); return; }
    if (t.hasAttribute('data-x')) closeModal();
    if (t.hasAttribute('data-tex')) exportTex();
    if (t.hasAttribute('data-go')) { const L2 = pdfOpt.mode === 'latex'; if (!L2) { closeModal(); exportScreenPDF(); } else exportLatexPDF(t); }
  };
  if (!L) return;
  const refresh = () => { clearTimeout(prevT); prevT = setTimeout(renderPreview, 250); };
  m.querySelector('#lxTitle').oninput = e => { W().docTitle = e.target.value; persist(); refresh(); };
  m.querySelector('#lxAuthor').oninput = e => { pdfOpt.author = e.target.value; savePdfOpt(); refresh(); };
  m.querySelectorAll('[data-o]').forEach(c => c.onchange = () => { pdfOpt[c.dataset.o] = c.checked; savePdfOpt(); refresh(); });
  renderPreview();
}
async function renderPreview(){
  const box = $('#lxPrev'); if (!box) return;
  const pages = await buildLatexPages(); if (!$('#lxPrev')) return;
  box.innerHTML = '';
  pages.forEach(p => { const w = document.createElement('div'); w.className = 'pv'; w.append(p.cloneNode(true)); box.append(w); });
  const n = document.createElement('div'); n.className = 'pvn'; n.textContent = pages.length + (pages.length === 1 ? ' page' : ' pages'); box.append(n);
}
async function exportLatexPDF(btn){
  btn.disabled = true; const label = btn.innerHTML; btn.innerHTML = '<span class="spin" style="width:16px;height:16px;border-width:2px;border-top-color:currentColor"></span>Typesetting…';
  try {
    if (!window.html2canvas) await loadScript('vendor/html2canvas.min.js');
    if (!window.jspdf) await loadScript('vendor/jspdf.umd.min.js');
    if (!window.html2canvas || !window.jspdf) { toast('The PDF tools could not load'); return; }
    const pages = await buildLatexPages(); const shot = document.createElement('div'); shot.className = 'lhost'; document.body.append(shot);
    const { jsPDF } = window.jspdf, pdf = new jsPDF({ orientation: 'portrait', unit: 'pt', format: 'a4', compress: true });
    const PW = pdf.internal.pageSize.getWidth(), PH = pdf.internal.pageSize.getHeight();
    for (let i = 0; i < pages.length; i++) {
      shot.replaceChildren(pages[i]);
      const c = await html2canvas(pages[i], { scale: 2.6, backgroundColor: '#ffffff', logging: false, width: 794, height: 1123, windowWidth: Math.max(innerWidth, 900), windowHeight: Math.max(innerHeight, 1200) });
      if (i) pdf.addPage();
      pdf.addImage(c.toDataURL('image/jpeg', .93), 'JPEG', 0, 0, PW, PH);
    }
    shot.remove();
    pdf.setProperties({ title: docTitle(buildDoc()), author: pdfOpt.author || '', creator: 'Symvolo' });
    const blob = pdf.output('blob'); closeModal();
    await saveFile(slug(W().name) + '.pdf', blob, 'application/pdf');
  } catch (e) { console.error(e); toast('Could not build the PDF'); }
  finally { if (document.body.contains(btn)) { btn.disabled = false; btn.innerHTML = label; } }
}

/* paste & drop on the stage */
addEventListener('paste', e => {
  if (editing(e.target) || !$('#scrim').hidden) return;
  const files = [...(e.clipboardData?.files || [])].filter(f => f.type.startsWith('image/'));
  if (files.length) { e.preventDefault(); openImport(files); return; }
  const t = e.clipboardData?.getData('text/plain');
  if (t && t.trim()) { e.preventDefault(); const r = stage.getBoundingClientRect(), p = toWorld(r.width * .4, r.height * .4); const b = addBlock(/^\s*\\|^\s*\$\$/.test(t) && !/\n\n/.test(t) ? 'math' : 'text', p.x, p.y, t.trim().replace(/^\$\$|\$\$$/g, '')); commit(); setSel([b.id]); }
});
stage.addEventListener('dragover', e => e.preventDefault());
stage.addEventListener('drop', e => { e.preventDefault(); const f = [...e.dataTransfer.files].filter(f => f.type.startsWith('image/')); if (f.length) openImport(f); else { const j = [...e.dataTransfer.files].find(f => /json$/i.test(f.name)); if (j) { const dt = new DataTransfer(); dt.items.add(j); $('#fileWs').files = dt.files; $('#fileWs').dispatchEvent(new Event('change')); } } });

/* ---------- wiring ---------- */
document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]')?.dataset.act; if (!a) return;
  if (a === 'import') openImport(); else if (a === 'pad') openPad({ kind: 'new' }); else if (a === 'add-math') createCentered('math'); else if (a === 'add-text') createCentered('text');
});
document.querySelectorAll('.rail [data-tool]').forEach(b => b.onclick = () => setTool(b.dataset.tool));
$('#snapBtn').onclick = toggleSnap;
$('#undoBtn').onclick = undo; $('#redoBtn').onclick = redo;
$('#saveBtn').onclick = () => $('#pop').hidden || $('#pop')._anchor !== $('#saveBtn') ? saveMenu() : closePop();
$('#wsMenuBtn').onclick = () => $('#pop').hidden ? wsMenu() : closePop();
$('#surfBtn').onclick = () => $('#pop').hidden ? surfMenu() : closePop();
$('#helpBtn').onclick = () => $('#pop').hidden ? helpMenu() : closePop();
$('#zoomIn').onclick = () => zoomStep(1.2); $('#zoomOut').onclick = () => zoomStep(1 / 1.2);
$('#zoomVal').onclick = () => zoomAt(1, innerWidth / 2, innerHeight / 2);
$('#fitBtn').onclick = () => fit();
$('#fullBtn').onclick = async () => { try { if (document.fullscreenElement) await document.exitFullscreen(); else await root.requestFullscreen(); } catch { toast('Full screen is not allowed in this view'); } };
const wsName = $('#wsName');
wsName.oninput = () => { W().name = wsName.value || 'Untitled workspace'; W().updated = Date.now(); persist(); document.title = W().name + ' — Symvolo'; };
wsName.onkeydown = e => { if (e.key === 'Enter') wsName.blur(); };
addEventListener('resize', () => { if (!$('#pop').hidden) closePop(); });

/* ---------- start ---------- */
$('#snapBtn').setAttribute('aria-pressed', !!S.snap);
setTool('select');
wsName.value = W().name; document.title = W().name + ' — Symvolo';
applySurface(); renderAll(); resetHistory();
const v0 = W().view; if (W().blocks.length && v0.x === 0 && v0.y === 0 && v0.z === 1) requestAnimationFrame(() => fit());
document.fonts?.ready.then(() => { for (const el of els.values()) el._key = null; W().blocks.forEach(drawBlock); });
setTimeout(loadMathLive, 1200);
(async () => {
  try { dl = await window.claude?.use?.('downloads') || null; } catch { dl = null; }
})();
initAI();
}
</script>
